name: Taiwan Stock Scanner

on:
  schedule:
    # 1. 盤前掃描：台灣時間 08:30 (UTC 00:30) 週一至週五
    - cron: '30 0 * * 1-5'
    # 2. 盤後掃描：台灣時間 16:30 (UTC 08:30) 週一至週五
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 支援手動一鍵執行

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas numpy yfinance

      - name: Run Scanner
        run: |
          python taiwan_stock_scanner.py
