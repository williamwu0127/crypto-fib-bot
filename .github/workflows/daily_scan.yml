name: Taiwan Stock Scanner

on:
  schedule:
    # 台灣時間週一至週五 16:30 (UTC 08:30) 執行
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 支援手動按鈕一鍵執行

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas numpy yfinance

      - name: Run Free Scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python taiwan_stock_free_scanner.py
