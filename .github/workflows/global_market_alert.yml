name: Global Market Monitor (08:00)

on:
  schedule:
    # 台灣時間 08:00 (UTC 00:00) 每天執行 (週一至週五)
    - cron: '0 0 * * 1-5'
  workflow_dispatch: # 支援隨時手動觸發

jobs:
  run-global-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance

      - name: 執行全球市場監控
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python global_market_monitor.py
