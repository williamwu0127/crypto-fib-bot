name: Global Market Weekly Monitor

on:
  schedule:
    # 台灣時間每週一早上 08:00 (UTC 週日 00:00) 執行
    - cron: '0 0 * * 1'
  workflow_dispatch: # 支援手動按鈕觸發

jobs:
  run-global-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Global Monitor
        run: |
          python global_market_monitor.py
