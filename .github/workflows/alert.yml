name: Crypto Fib Alert

on:
  schedule:
    - cron: '0 * * * *'  # 每小時整點自動執行
  workflow_dispatch:       # 支援手動點擊測試

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行交易監控腳本
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py
