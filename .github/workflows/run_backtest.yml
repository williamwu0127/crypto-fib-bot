name: Run Backtest

on:
  workflow_dispatch: # 允許在網頁上手動點擊執行

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行過去 7 天量化回測
        run: python backtest.py
