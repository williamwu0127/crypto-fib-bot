name: JPY Exchange Rate Monitor

on:
  schedule:
    # 台灣時間週一至週五 09:15 (UTC 01:15) 執行
    - cron: '15 1 * * 1-5'
  workflow_dispatch: # 支援手動一鍵執行

jobs:
  run-jpy-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas yfinance

      - name: Run JPY Monitor
        run: |
          python jpy_monitor.py
